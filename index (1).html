<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Lời Hát</title>
<style>
:root{--bg:#0b0b14;--fg:#fff;--panel:rgba(15,15,30,.7);--acc:#7cf5ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover;transform:scaleX(-1);background:radial-gradient(circle at 50% 40%,#25204a,#0b0b14)}
video.back{transform:none}
#bar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;backdrop-filter:blur(8px)}
button.on{background:var(--acc);color:#001;border-color:var(--acc)}
#pan{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 96px);display:none}
#pan.show{display:block}
textarea{width:100%;box-sizing:border-box;height:32vh;border-radius:14px;resize:none;touch-action:auto}
#pan small{display:block;margin-top:4px;opacity:.8;font-size:12px;text-shadow:0 1px 3px #000}
input{touch-action:auto}
#spl{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:14px}
#spl input{width:84px}
#cap{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="bar">
  <button id="go">🎤 Bắt đầu</button>
  <select id="lang"><option value="vi-VN">Tiếng Việt</option><option value="en-US">English</option><option value="ko-KR">한국어</option><option value="ja-JP">日本語</option><option value="zh-CN">中文</option></select>
  <label id="spl">↔<input id="sp" type="range" min="1" max="4" step=".5" value="2.5"></label>
  <button id="lyr">📝 Lời bài hát</button>
  <button id="flip">🔄</button>
  <button id="clr">🧹</button>
</div>
<div id="pan"><textarea id="ly" placeholder="Dán lời bài hát vào đây (mỗi câu 1 dòng). Để trống = chế độ tự do, vẽ đúng những gì máy nghe được."></textarea><small>Có lời: app sẽ so khớp những gì bạn hát với lời và vẽ lời ĐÚNG, dù máy nghe sai vài chữ. Bấm “Bắt đầu” lại sau khi sửa lời.</small></div>
<div id="cap">Bấm “Bắt đầu”, cho phép camera + micro rồi hát hoặc nói. Xoay điện thoại quanh người để thấy chữ lơ lửng trong không gian.</div>
<script>
const $=i=>document.getElementById(i);
const cv=$('c'),ctx=cv.getContext('2d'),vid=$('v'),cap=$('cap'),go=$('go');
let W,H,ppd,words=[],facing='user',stream=null,rec=null,running=false;
let yaw=0,pitch=0,yaw0=null,gyro=false,hue=180;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ppd=H/60}
addEventListener('resize',resize);resize();
const SZ=()=>Math.min(W,H)*.085;

/* ---------- camera ---------- */
async function startCam(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    const long=Math.max(innerWidth,innerHeight),short=Math.min(innerWidth,innerHeight),ar=innerWidth/innerHeight;
    const hi={facingMode:facing,width:{ideal:ar<1?1080:1920},height:{ideal:ar<1?1920:1080},aspectRatio:{ideal:ar}};
    try{stream=await navigator.mediaDevices.getUserMedia({video:hi,audio:false})}
    catch(_){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}
    vid.srcObject=stream;vid.classList.toggle('back',facing!=='user');
    vid.play().catch(()=>{});
  }catch(e){cap.textContent='Không mở được camera ('+e.name+'). Cần mở bằng HTTPS và cho phép camera. Vẫn dùng được với nền tối.'}
}
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
$('clr').onclick=()=>{words=[];yaw0=null;yaw=0;pitch=0};
$('lyr').onclick=()=>$('pan').classList.toggle('show');

/* ---------- hướng nhìn: gyro (điện thoại) hoặc kéo chuột (máy tính) ---------- */
addEventListener('deviceorientation',e=>{
  const a=e.webkitCompassHeading!=null?360-e.webkitCompassHeading:e.alpha;
  if(a==null||e.beta==null)return;
  gyro=true;if(yaw0===null)yaw0=a;
  yaw=a-yaw0;pitch=Math.max(-60,Math.min(60,e.beta-90));
});
let dn=null;
cv.addEventListener('pointerdown',e=>{dn=e});
addEventListener('pointerup',()=>{dn=null});
addEventListener('pointermove',e=>{if(!dn||gyro)return;yaw+=(e.clientX-dn.clientX)/ppd;pitch+=(e.clientY-dn.clientY)/ppd;dn=e});

/* ---------- bố cục chữ trong không gian ---------- */
const newLine=()=>{hue=(hue+47)%360};
const dwrap=d=>((d+540)%360+360)%360-180;
function measure(txt,size){ctx.font='800 '+size+'px system-ui,sans-serif';return ctx.measureText(txt).width/ppd}
function retext(w,t){w.txt=t;w.wd=measure(t,w.size)}
function spawn(t){
  const size=SZ()*(.8+Math.random()*.55);
  const wd=measure(t,size),hd=size*1.2/ppd,sp=+$('sp').value;
  const vx=Math.max(1,W/ppd/2-wd/2-2),vy=Math.max(1,21-hd/2);
  const wx=Math.max(vx,sp*30-wd/2),wy=Math.max(vy,21+(sp-1)*8-hd/2);
  const now=performance.now(),live=words.filter(w=>now-w.t<w.life*1000-1500);
  let best=null,bs=-1e9;
  for(let i=0;i<60;i++){
    const nar=Math.random()<.4,hx=nar?vx:wx,hy=nar?vy:wy;
    const wc=yaw+(Math.random()*2-1)*hx,wp=pitch+(Math.random()*2-1)*hy;
    let s=1e9;
    for(const w of live){
      const sx=Math.abs(dwrap(wc-w.wc))-(wd+w.wd)/2,sy=Math.abs(wp-w.wp)-(hd+w.hd)/2;
      s=Math.min(s,Math.max(sx,sy));
    }
    if(s>bs){bs=s;best={wc,wp}}
    if(s>=2.5)break;
  }
  const o={t:now,txt:t,wc:best.wc,wp:best.wp,wd,hd,size,hue,ph:Math.random()*6.28,life:16};
  words.push(o);return o;
}

/* ---------- so khớp lời bài hát (sửa nhận sai) ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9\s]/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
let lines=[],li=0,shown=new Set();
function loadLyrics(){lines=$('ly').value.split('\n').map(s=>s.trim()).filter(Boolean);li=0;shown.clear()}
function sim(text){
  const R=norm(text).split(/\s+/).filter(Boolean);if(R.length<2)return[-1,0];
  let best=-1,bs=0;
  for(let k=li;k<Math.min(lines.length,li+4);k++){
    const L=norm(lines[k]).split(/\s+/);let m=0;
    for(const r of R)if(L.some(l=>l===r||(l.length>3&&r.length>3&&lev(l,r)<=1)))m++;
    const sc=m>=2?m/Math.min(R.length,L.length):m*.2;
    if(sc>bs){bs=sc;best=k}
  }
  return[best,bs];
}
function match(text){
  const[best,bs]=sim(text);
  if(best>=0&&bs>=.55&&!shown.has(best)){
    shown.add(best);li=best+1;newLine();
    lines[best].split(/\s+/).forEach((w,i)=>setTimeout(()=>spawn(w),i*170));
  }
}

/* ---------- nhận giọng nói: 5 phương án, chọn đúng nhất, chỉ vẽ từ đã ổn định, tự sửa khi có kết quả cuối ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let prevWs={},rawWs={},objs={},lastIdx=-1;
function pickAlt(r){
  let bt=r[0].transcript;if(!lines.length)return bt;
  let bs=-1;
  for(let a=0;a<r.length;a++){const sc=sim(r[a].transcript)[1];if(sc>bs){bs=sc;bt=r[a].transcript}}
  return bt;
}
function startRec(){
  if(!SR){cap.textContent='Trình duyệt chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome (Android/máy tính) hoặc Safari mới.';return}
  rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=5;
  prevWs={};rawWs={};objs={};lastIdx=-1;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],text=pickAlt(r).trim();cap.textContent=text||'…';
      if(lines.length){match(text);continue}
      let ws=text.split(/\s+/).filter(Boolean);
      rawWs[i]=ws.slice();
      const pr=e.results[i-1];
      if(i>0&&pr&&pr.isFinal){const f=rawWs[i-1]||[];if(f.length&&ws.length>f.length&&f.every((w,k)=>w===ws[k]))ws=ws.slice(f.length)}
      const prev=prevWs[i]||[];let st=0;
      while(st<ws.length&&st<prev.length&&ws[st]===prev[st])st++;
      prevWs[i]=ws;
      const upto=r.isFinal?ws.length:st;
      if(i!==lastIdx){lastIdx=i;newLine()}
      const arr=objs[i]||(objs[i]=[]);
      for(let j=0;j<upto;j++){
        if(j>=arr.length)arr.push(spawn(ws[j]));
        else if(arr[j].txt!==ws[j])retext(arr[j],ws[j]);
      }
      if(r.isFinal){
        const now=performance.now();
        for(let j=ws.length;j<arr.length;j++)arr[j].life=Math.min(arr[j].life,(now-arr[j].t)/1000+2);
        arr.length=Math.min(arr.length,ws.length);
      }
    }
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();cap.textContent='Chưa được cấp quyền micro.'}
    else if(e.error==='network')cap.textContent='Lỗi mạng khi nhận giọng nói, đang thử lại…';
  };
  rec.onend=()=>{if(running)setTimeout(startRec,300)};
  try{rec.start()}catch(_){}
}
function stop(){running=false;if(rec){rec.onend=null;try{rec.stop()}catch(_){}}go.classList.remove('on');go.textContent='🎤 Bắt đầu'}
go.onclick=()=>{
  if(running){stop();cap.textContent='Đã dừng.';return}
  const p=window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission?DeviceOrientationEvent.requestPermission().catch(()=>{}):null;
  loadLyrics();running=true;go.classList.add('on');go.textContent='⏹ Dừng';
  cap.textContent=lines.length?'Đang nghe… hát theo lời đã dán!':'Đang nghe… hãy hát hoặc nói!';
  startRec();startCam();$('pan').classList.remove('show');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(_){}
};
$('lang').onchange=()=>{if(running){rec.onend=null;try{rec.stop()}catch(_){}startRec()}};

/* ---------- vẽ ---------- */
function frame(now){
  ctx.clearRect(0,0,W,H);
  words=words.filter(w=>(now-w.t)/1000<w.life);
  for(const w of words){
    const a=(now-w.t)/1000,p=Math.min(a/.9,1),ease=1-Math.pow(1-p,3),fade=Math.min(1,(w.life-a)/2);
    const dx=((yaw-w.wc+540)%360+360)%360-180;
    const x=W/2+dx*ppd,y=H/2-(w.wp-pitch)*ppd+Math.sin(a*1.5+w.ph)*5;
    const hw=w.wd*ppd/2;
    if(x<-hw||x>W+hw||y<-60||y>H+60){
      if(a<4){
        ctx.save();ctx.globalAlpha=Math.max(0,1-a/4);ctx.fillStyle='hsl('+w.hue+',100%,70%)';
        ctx.font='700 24px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(x<-hw?'◀':x>W+hw?'▶':y<0?'▲':'▼',Math.max(16,Math.min(W-16,x)),Math.max(90,Math.min(H-70,y)));
        ctx.restore();
      }
      continue;
    }
    ctx.save();ctx.translate(x,y);ctx.scale(.7+.3*ease,.7+.3*ease);
    ctx.font='800 '+w.size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=fade;ctx.lineJoin='round';
    const col='hsl('+w.hue+',100%,70%)';
    ctx.shadowColor=col;ctx.shadowBlur=18;ctx.strokeStyle=col;ctx.lineWidth=2.5;
    const L=w.wd*ppd*5;ctx.setLineDash([L*ease,L]);ctx.strokeText(w.txt,0,0);ctx.setLineDash([]);
    ctx.globalAlpha=fade*Math.max(0,(p-.5)*2);ctx.fillStyle='rgba(255,255,255,.95)';ctx.shadowBlur=10;ctx.fillText(w.txt,0,0);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
